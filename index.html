<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym English">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230a0a0a'/%3E%3Ctext x='90' y='115' font-size='100' text-anchor='middle' fill='%23f5d547'%3E💪%3C/text%3E%3C/svg%3E">
<title>Gym English 💪</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0a0a0a;
    --bg-2: #161616;
    --surface: #1f1f1f;
    --surface-2: #2a2a2a;
    --accent: #f5d547;
    --accent-2: #ff5e3a;
    --text: #f5f5f5;
    --text-dim: #888;
    --border: #2e2e2e;
    --success: #4ade80;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    background:
      radial-gradient(ellipse at top, rgba(245,213,71,0.08), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(255,94,58,0.06), transparent 50%),
      var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .app { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 2; min-height: 0; }

  /* ===== Header ===== */
  header {
    padding: 14px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 0.05em;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo-mark { color: var(--text); }
  .level-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    font-size: 11px;
    font-weight: 700;
  }
  .level-toggle button {
    padding: 5px 12px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
  }
  .level-toggle button.active {
    background: var(--accent);
    color: #000;
  }

  /* ===== Tab Bar (bottom) ===== */
  nav.tabs {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    flex: 1;
    padding: 12px 8px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-weight: 700;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border-top: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  nav.tabs button .ico { font-size: 22px; }
  nav.tabs button.active {
    color: var(--accent);
    border-top-color: var(--accent);
  }

  /* ===== Views ===== */
  main {
    flex: 1;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }
  .view {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 20px 20px;
    display: none;
    flex-direction: column;
  }
  .view.active { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ===== Home ===== */
  .hero {
    background: linear-gradient(135deg, var(--accent) 0%, #f5b547 100%);
    color: #000;
    padding: 22px 22px 24px;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .hero::before {
    content: 'GYM';
    position: absolute;
    right: -20px;
    bottom: -50px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 200px;
    color: rgba(0,0,0,0.08);
    line-height: 0.8;
    pointer-events: none;
  }
  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    line-height: 1;
    letter-spacing: 0.02em;
    position: relative;
  }
  .hero p {
    margin-top: 6px;
    font-size: 13px;
    opacity: 0.75;
    position: relative;
  }
  .progress-card {
    margin-top: 14px;
    background: rgba(0,0,0,0.12);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    font-size: 12px;
    font-weight: 700;
  }
  .progress-bar-wrap {
    flex: 1;
    height: 6px;
    background: rgba(0,0,0,0.15);
    border-radius: 999px;
    margin: 0 12px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #000;
    border-radius: 999px;
    transition: width 0.4s;
  }

  .home-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .menu-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 16px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s;
    text-align: left;
    color: var(--text);
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 110px;
  }
  .menu-card:active { transform: scale(0.97); }
  .menu-card .ico { font-size: 28px; }
  .menu-card h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  .menu-card p { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
  .menu-card.roleplay h3 { color: var(--accent-2); }

  .tip-section h4 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .daily-tip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
  }
  .daily-tip .en { color: var(--text); font-weight: 500; }
  .daily-tip .ja { color: var(--text-dim); font-size: 12px; margin-top: 4px; }

  /* ===== Flashcards ===== */
  .cards-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .category-pills {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 12px;
    scrollbar-width: none;
  }
  .category-pills::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .pill.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  .card-counter {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 8px;
    letter-spacing: 0.1em;
  }

  .flashcard-area {
    flex: 1;
    perspective: 1200px;
    display: flex;
    align-items: stretch;
    justify-content: center;
    min-height: 280px;
  }
  .flashcard {
    width: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .card-face.back { transform: rotateY(180deg); background: var(--bg-2); }
  .card-cat {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .card-chunks {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
    margin-bottom: 10px;
  }
  .card-chunk {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--text);
    background: rgba(245, 213, 71, 0.10);
    border: 1px solid rgba(245, 213, 71, 0.35);
    border-radius: 8px;
    padding: 6px 11px 5px;
    white-space: nowrap;
  }
  .card-chunks.long .card-chunk { font-size: 22px; padding: 5px 9px 4px; }
  .card-chunks.xlong .card-chunk { font-size: 17px; padding: 4px 8px 3px; }
  .card-pron {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .card-hint {
    background: rgba(245,213,71,0.04);
    border-left: 2px solid rgba(245,213,71,0.4);
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.55;
    color: #cfcfcf;
  }
  .card-hint .hint-label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .card-hint .hint-emoji {
    font-size: 18px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }
  .icon-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .icon-btn:active { transform: scale(0.95); }
  .icon-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
  .icon-btn.success { background: var(--success); color: #000; border-color: var(--success); }
  .icon-btn.mark.marked { background: var(--success); color: #000; border-color: var(--success); }
  .icon-btn.shadow.active {
    background: var(--accent-2);
    color: #fff;
    border-color: var(--accent-2);
  }

  .shadow-status {
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(255,94,58,0.10);
    border: 1px solid rgba(255,94,58,0.35);
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-2);
    text-align: center;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    animation: shadow-pulse 1.1s ease-in-out infinite alternate;
  }
  @keyframes shadow-pulse {
    from { opacity: 0.65; }
    to   { opacity: 1; }
  }

  .card-ja {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .card-example {
    background: rgba(245,213,71,0.06);
    border-left: 3px solid var(--accent);
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .card-example .en {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 4px;
    color: var(--text);
  }
  .card-example .ja {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .example-chunks {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 5px;
    margin-bottom: 6px;
  }
  .example-chunk {
    font-size: 13px;
    line-height: 1.25;
    color: var(--text);
    background: rgba(245, 213, 71, 0.06);
    border: 1px solid rgba(245, 213, 71, 0.22);
    border-radius: 6px;
    padding: 3px 7px;
    white-space: nowrap;
  }

  .card-nav {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .nav-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn:active { transform: scale(0.97); }
  .nav-btn.next { background: var(--accent); color: #000; border-color: var(--accent); }

  /* ===== Roleplay ===== */
  .roleplay-intro {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .roleplay-intro h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    color: var(--accent-2);
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .roleplay-intro p { font-size: 12px; color: var(--text-dim); line-height: 1.5; }

  .scenario-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 200px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    animation: msgIn 0.25s ease;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.bot {
    background: var(--surface);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--accent);
    color: #000;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .msg .meta {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
  }
  .msg.bot .ja {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.5;
    border-top: 1px dashed var(--border);
    padding-top: 6px;
  }
  .msg-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .msg-mini-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-family: inherit;
    cursor: pointer;
  }
  .msg.user .msg-mini-btn {
    background: rgba(0,0,0,0.1);
    color: rgba(0,0,0,0.6);
    border-color: rgba(0,0,0,0.15);
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 10px 14px;
    align-self: flex-start;
    background: var(--surface);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px; height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

  .chat-input-wrap {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .chat-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    outline: none;
  }
  .chat-input:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 0 16px;
    border-radius: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.1em;
    cursor: pointer;
    font-weight: 700;
  }
  .send-btn:disabled { opacity: 0.4; }

  .suggestion-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .chip {
    background: var(--surface);
    border: 1px dashed var(--border);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
  }
  .chip:active { background: var(--surface-2); }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* hint footer */
  .swipe-hint {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo"><span class="logo-mark">💪</span><span>GYM ENGLISH</span></div>
    <div class="level-toggle" id="levelToggle">
      <button class="active" data-level="beginner">初級</button>
      <button data-level="intermediate">中級</button>
    </div>
  </header>

  <main>
    <!-- HOME VIEW -->
    <section class="view active" id="view-home">
      <div class="hero">
        <h1>Train hard.<br>Talk harder.</h1>
        <p>ジムでの隙間時間に、英語をひと押し。</p>
        <div class="progress-card">
          <span>覚えた</span>
          <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
          <span id="progressText">0/20</span>
        </div>
      </div>

      <div class="home-grid">
        <button class="menu-card" data-go="cards">
          <div class="ico">📇</div>
          <h3>FLASHCARDS</h3>
          <p>20単語＋フレーズ<br>タップで意味を表示</p>
        </button>
        <button class="menu-card roleplay" data-go="roleplay">
          <div class="ico">💬</div>
          <h3>ROLEPLAY</h3>
          <p>AIと雑談練習<br>ジム仲間との会話</p>
        </button>
      </div>

      <div class="tip-section">
        <h4>TODAY'S PHRASE</h4>
        <div class="daily-tip" id="dailyTip">
          <div class="en">Loading...</div>
        </div>
      </div>
    </section>

    <!-- FLASHCARDS VIEW -->
    <section class="view" id="view-cards">
      <div class="category-pills" id="categoryPills">
        <button class="pill active" data-cat="all">ALL</button>
        <button class="pill" data-cat="equipment">器具</button>
        <button class="pill" data-cat="action">動作</button>
        <button class="pill" data-cat="body">部位</button>
        <button class="pill" data-cat="phrase">会話</button>
      </div>

  },
  rest: {
    label: "休憩日の話",
    opener: { en: "I haven't seen you in a couple days — rest day yesterday?", ja: "ここ数日見かけなかったね、昨日休んだ？" },
    context: "You're at the gym. Another regular noticed you weren't there and asks about rest days. Friendly, casual chat about recovery, schedules, etc.",
    suggestions: ["Yeah, I take Sundays off.", "I was sore, needed a break.", "Nope, I was just busy."]
  }
};

// ============= STATE =============
let state = {
  level: "beginner",
  cardIdx: 0,
  category: "all",
  filtered: [],
  marked: {},  // { "treadmill": true, ... }
  scenario: "machine",
  chatHistory: [],
  isSending: false
};

// ============= STORAGE =============
async function loadState() {
  try {
    const r = await window.storage.get("gym_eng_state");
    if (r && r.value) {
      const saved = JSON.parse(r.value);
      state.level = saved.level || "beginner";
      state.marked = saved.marked || {};
    }
  } catch (e) { /* first run */ }
}
async function saveState() {
  try {
    await window.storage.set("gym_eng_state", JSON.stringify({ level: state.level, marked: state.marked }));
  } catch (e) { console.error(e); }
}

// ============= TOAST =============
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

// ============= TTS =============
function pickEnVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang.startsWith("en") && /Samantha|Alex|Karen|Google US/i.test(v.name))
      || voices.find(v => v.lang.startsWith("en"));
}
function speak(text, rate = 0.92) {
  if (!window.speechSynthesis) { toast("音声非対応"); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = rate;
  u.pitch = 1.0;
  const v = pickEnVoice();
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
// Promise版（シャドーイング用）。再生終了 or abort で resolve。
function speakAsync(text, rate, token) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) { resolve(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate;
    u.pitch = 1.0;
    const v = pickEnVoice();
    if (v) u.voice = v;
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    u.onend = finish;
    u.onerror = finish;
    window.speechSynthesis.speak(u);
    if (token) {
      const checker = setInterval(() => {
        if (token.aborted) {
          clearInterval(checker);
          window.speechSynthesis.cancel();
          finish();
        } else if (done) {
          clearInterval(checker);
        }
      }, 100);
    }
  });
}
function delay(ms, token) {
  return new Promise(resolve => {
    const t = setTimeout(resolve, ms);
    if (token) {
      const checker = setInterval(() => {
        if (token.aborted) {
          clearTimeout(t);
          clearInterval(checker);
          resolve();
        }
      }, 100);
    }
  });
}
// pre-load voices on iOS
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
  window.speechSynthesis.getVoices();
}

// ============= SHADOWING =============
// 3ステップで「聴く→真似る→確認する」を回す。
// 1) 🐢 ゆっくり再生（0.55x） → 2) 🎤 自分で発声（無音3秒） → 3) 🚀 通常速で再生（1.0x）
let shadowToken = null;
async function startShadowing() {
  const card = state.filtered[state.cardIdx];
  if (!card) return;
  // 既に走っていれば停止
  if (shadowToken) {
    shadowToken.aborted = true;
    return;
  }
  const token = { aborted: false };
  shadowToken = token;
  setShadowUI(true);
  try {
    setShadowStatus("🐢 STEP 1 / 3 — LISTEN (slow)");
    await speakAsync(card.en, 0.55, token);
    if (token.aborted) return;
    setShadowStatus("🎤 STEP 2 / 3 — YOUR TURN, speak it!");
    await delay(3000, token);
    if (token.aborted) return;
    setShadowStatus("🚀 STEP 3 / 3 — LISTEN (full speed)");
    await speakAsync(card.en, 1.0, token);
    if (token.aborted) return;
    setShadowStatus("✓ NICE! one more round?");
    await delay(1500, token);
  } finally {
    shadowToken = null;
    setShadowUI(false);
  }
}
function abortShadowing() {
  if (shadowToken) {
    shadowToken.aborted = true;
    window.speechSynthesis && window.speechSynthesis.cancel();
  }
}
function setShadowUI(active) {
  const btn = document.getElementById("shadowBtn");
  const status = document.getElementById("shadowStatus");
  btn.classList.toggle("active", active);
  btn.textContent = active ? "■ STOP" : "🎯 シャドー";
  if (!active) {
    status.hidden = true;
    status.textContent = "";
  }
}
function setShadowStatus(text) {
  const status = document.getElementById("shadowStatus");
  status.hidden = false;
  status.textContent = text;
}

// ============= NAVIGATION =============
function showView(name) {
  if (name !== "cards") abortShadowing(); // CARDS 以外に移動したらシャドーイング停止
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + name).classList.add("active");
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  if (name === "cards") { applyFilter(); renderCard(); }
  if (name === "roleplay" && state.chatHistory.length === 0) { startScenario(); }
}

document.querySelectorAll("nav.tabs button").forEach(b => {
  b.addEventListener("click", () => showView(b.dataset.tab));
});
document.querySelectorAll(".menu-card").forEach(b => {
  b.addEventListener("click", () => showView(b.dataset.go));
});

// ============= LEVEL TOGGLE =============
document.querySelectorAll("#levelToggle button").forEach(b => {
  b.addEventListener("click", () => {
    if (state.level === b.dataset.level) return;
    state.level = b.dataset.level;
    document.querySelectorAll("#levelToggle button").forEach(x => x.classList.toggle("active", x === b));
    state.cardIdx = 0;
    applyFilter();
    renderCard();
    renderProgress();
    renderDailyTip();
    saveState();
    toast(state.level === "beginner" ? "初級に切替" : "中級に切替");
  });
});

// ============= FLASHCARDS =============
function applyFilter() {
  const all = VOCAB[state.level];
  state.filtered = state.category === "all" ? all : all.filter(c => c.cat === state.category);
  if (state.cardIdx >= state.filtered.length) state.cardIdx = 0;
}

function renderCard() {
  const card = state.filtered[state.cardIdx];
  if (!card) return;
  abortShadowing(); // カードが変わったらシャドーイングを止める
  document.getElementById("cardCat").textContent = card.catLabel;
  const enEl = document.getElementById("cardEn");
  enEl.innerHTML = "";
  const chunks = Array.isArray(card.chunks) && card.chunks.length ? card.chunks : [card.en];
  chunks.forEach(c => {
    const span = document.createElement("span");
    span.className = "card-chunk";
    span.textContent = c;
    enEl.appendChild(span);
  });
  enEl.classList.remove("long", "xlong");
  if (card.en.length > 26) enEl.classList.add("xlong");
  else if (card.en.length > 16) enEl.classList.add("long");
  document.getElementById("cardPron").textContent = card.pron;
  document.getElementById("cardHintEmoji").textContent = card.emoji || "💭";
  document.getElementById("cardHintText").textContent = card.hint || "";
  document.getElementById("cardJa").textContent = card.ja;
  const exEnEl = document.getElementById("cardExEn");
  exEnEl.innerHTML = "";
  const exChunks = Array.isArray(card.exChunks) && card.exChunks.length ? card.exChunks : [card.exEn];
  exChunks.forEach(c => {
    const span = document.createElement("span");
    span.className = "example-chunk";
    span.textContent = c;
    exEnEl.appendChild(span);
  });
  document.getElementById("cardExJa").textContent = card.exJa;
  document.getElementById("cardCounter").textContent = `${state.cardIdx + 1} / ${state.filtered.length}`;
  // mark state
  const markBtn = document.getElementById("markBtn");
  if (state.marked[card.en]) {
    markBtn.classList.add("marked");
    markBtn.textContent = "★ 覚えた";
  } else {
    markBtn.classList.remove("marked");
    markBtn.textContent = "☆ 覚えた";
  }
  // unflip
  document.getElementById("flashcard").classList.remove("flipped");
}

document.getElementById("flashcard").addEventListener("click", (e) => {
  if (e.target.closest(".icon-btn")) return;
  if (shadowToken) return; // シャドーイング中はめくれない
  document.getElementById("flashcard").classList.toggle("flipped");
});

document.getElementById("speakBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  speak(state.filtered[state.cardIdx].en);
});
document.getElementById("shadowBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  startShadowing();
});
document.getElementById("speakExBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  speak(state.filtered[state.cardIdx].exEn);
});
document.getElementById("markBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const card = state.filtered[state.cardIdx];
  state.marked[card.en] = !state.marked[card.en];
  saveState();
  renderCard();
  renderProgress();
  toast(state.marked[card.en] ? "覚えた！💪" : "もう一度復習");
});

document.getElementById("prevBtn").addEventListener("click", () => {
  state.cardIdx = (state.cardIdx - 1 + state.filtered.length) % state.filtered.length;
  renderCard();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  state.cardIdx = (state.cardIdx + 1) % state.filtered.length;
  renderCard();
});

// swipe support
let touchStartX = 0;
const flashcardArea = document.querySelector(".flashcard-area");
flashcardArea.addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; }, { passive: true });
flashcardArea.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) {
    if (dx < 0) document.getElementById("nextBtn").click();
    else document.getElementById("prevBtn").click();
  }
}, { passive: true });

document.querySelectorAll("#categoryPills .pill").forEach(p => {
  p.addEventListener("click", () => {
    document.querySelectorAll("#categoryPills .pill").forEach(x => x.classList.remove("active"));
    p.classList.add("active");
    state.category = p.dataset.cat;
    state.cardIdx = 0;
    applyFilter();
    renderCard();
  });
});

// ============= PROGRESS =============
function renderProgress() {
  const total = VOCAB[state.level].length;
  const learned = VOCAB[state.level].filter(c => state.marked[c.en]).length;
  document.getElementById("progressText").textContent = `${learned}/${total}`;
  document.getElementById("progressBar").style.width = `${(learned / total) * 100}%`;
}

function renderDailyTip() {
  const all = VOCAB[state.level].filter(v => v.cat === "phrase");
  const tip = all[Math.floor(Math.random() * all.length)];
  const el = document.getElementById("dailyTip");
  el.innerHTML = `<div class="en">"${tip.exEn}"</div><div class="ja">${tip.exJa}</div>`;
}

// ============= ROLEPLAY =============
function startScenario() {
  state.chatHistory = [];
  const sc = SCENARIOS[state.scenario];
  const chatArea = document.getElementById("chatArea");
  chatArea.innerHTML = "";
  addBotMessage(sc.opener.en, sc.opener.ja);
  state.chatHistory.push({ role: "assistant", content: sc.opener.en });
  renderSuggestions();
}

function renderSuggestions() {
  const sc = SCENARIOS[state.scenario];
  const chips = document.getElementById("suggestionChips");
  chips.innerHTML = "";
  sc.suggestions.forEach(s => {
    const c = document.createElement("button");
    c.className = "chip";
    c.textContent = s;
    c.addEventListener("click", () => {
      document.getElementById("chatInput").value = s;
      document.getElementById("chatInput").focus();
    });
    chips.appendChild(c);
  });
}

function addBotMessage(en, ja) {
  const chatArea = document.getElementById("chatArea");
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = `
    <div class="en">${escapeHtml(en)}</div>
    ${ja ? `<div class="ja">🇯🇵 ${escapeHtml(ja)}</div>` : ''}
    <div class="msg-actions">
      <button class="msg-mini-btn speak-btn">🔊 発音</button>
      ${ja ? '' : '<button class="msg-mini-btn translate-btn">🇯🇵 訳</button>'}
    </div>
  `;
  div.querySelector(".speak-btn").addEventListener("click", () => speak(en));
  const tBtn = div.querySelector(".translate-btn");
  if (tBtn) {
    tBtn.addEventListener("click", () => translateMessage(en, div, tBtn));
  }
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addUserMessage(text) {
  const chatArea = document.getElementById("chatArea");
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div>${escapeHtml(text)}</div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const chatArea = document.getElementById("chatArea");
  const t = document.createElement("div");
  t.className = "typing";
  t.id = "typingIndicator";
  t.innerHTML = "<span></span><span></span><span></span>";
  chatArea.appendChild(t);
  chatArea.scrollTop = chatArea.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById("typingIndicator");
  if (t) t.remove();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function sendMessage() {
  if (state.isSending) return;
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addUserMessage(text);
  state.chatHistory.push({ role: "user", content: text });
  state.isSending = true;
  document.getElementById("sendBtn").disabled = true;

  showTyping();

  try {
    const sc = SCENARIOS[state.scenario];
    const systemPrompt = `You are a friendly fellow gym-goer chatting with someone at the gym. Scenario: ${sc.context}

Rules:
- Reply in ENGLISH ONLY.
- Keep replies SHORT (1-2 sentences max, like real gym small talk).
- Use simple, natural gym vocabulary appropriate for ${state.level} level.
- Be encouraging and friendly.
- Sometimes ask a follow-up question to keep the conversation going.
- Do NOT translate or explain — just reply naturally as a gym buddy would.`;

    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 200,
        system: systemPrompt,
        messages: state.chatHistory
      })
    });
    const data = await resp.json();
    hideTyping();

    const reply = data.content?.find(b => b.type === "text")?.text?.trim() || "Sorry, what was that?";
    state.chatHistory.push({ role: "assistant", content: reply });
    addBotMessage(reply, null);
  } catch (e) {
    hideTyping();
    addBotMessage("Hmm, couldn't hear you over the music. Try again?", "（ネットワークエラー — もう一度試してね）");
    console.error(e);
  } finally {
    state.isSending = false;
    document.getElementById("sendBtn").disabled = false;
  }
}

async function translateMessage(en, container, btn) {
  btn.disabled = true;
  btn.textContent = "...";
  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 200,
        messages: [{ role: "user", content: `Translate this gym conversation line into natural casual Japanese. Reply with ONLY the translation, no explanation:\n\n"${en}"` }]
      })
    });
    const data = await resp.json();
    const ja = data.content?.find(b => b.type === "text")?.text?.trim().replace(/^["「]|["」]$/g, "") || "(翻訳失敗)";
    const jaDiv = document.createElement("div");
    jaDiv.className = "ja";
    jaDiv.textContent = "🇯🇵 " + ja;
    container.querySelector(".msg-actions").insertAdjacentElement("beforebegin", jaDiv);
    btn.remove();
  } catch (e) {
    btn.textContent = "🇯🇵 訳";
    btn.disabled = false;
    toast("翻訳失敗");
  }
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("chatInput").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

document.querySelectorAll(".scenario-pills .pill").forEach(p => {
  p.addEventListener("click", () => {
    document.querySelectorAll(".scenario-pills .pill").forEach(x => x.classList.remove("active"));
    p.classList.add("active");
    state.scenario = p.dataset.sc;
    startScenario();
  });
});

// ============= INIT =============
(async function init() {
  await loadState();
  // sync level toggle UI
  document.querySelectorAll("#levelToggle button").forEach(b => {
    b.classList.toggle("active", b.dataset.level === state.level);
  });
  applyFilter();
  renderCard();
  renderProgress();
  renderDailyTip();
})();
</script>
